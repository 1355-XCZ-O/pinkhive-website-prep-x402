services:
  - type: web
    name: pinkhive-website-prep-x402
    runtime: docker
    repo: https://github.com/1355-XCZ-O/pinkhive-website-prep-x402
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile.x402
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: X402_NETWORK
        value: eip155:8453
      - key: X402_PAY_TO
        value: 0x8CfB0c37Af0C40f96c44fd45FdEC30b430Bc6A6e
      - key: X402_FACILITATOR_URL
        value: https://facilitator.openx402.ai
      - key: PRICE_USD
        value: "0.01"
      - key: SHIP_GUARD_PRICE_USD
        value: "0.05"
      - key: EVM_RECEIPT_PRICE_USD
        value: "0.01"
      - key: SALARY_AUDIT_PRICE_USD
        value: "0.01"
      - key: BASE_RPC_URL
        value: https://mainnet.base.org
